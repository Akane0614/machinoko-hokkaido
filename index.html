<style>
:root{--navy:#174a7c;--blue:#4ca9e9;--pink:#ef5f8d;--green:#55b99a;--cream:#fff9ec;--text:#273747;--muted:#6b7785;--line:#cfe3ef}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text);background:linear-gradient(#eaf8ff,#fffaf0 58%,#f4fbf5)}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:auto;padding:12px 10px calc(22px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 7px 20px rgba(36,76,105,.08)}
.hero{text-align:center;padding:24px 15px}
.hero h1{font-size:34px;line-height:1.08;color:var(--navy);margin:9px 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:800;font-size:12px;background:white}
.btn{width:100%;min-height:54px;border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-weight:900;background:white;color:var(--navy)}
.btn.primary{background:#eef4ff;border:2px solid #4d7df0;color:#111}.btn:disabled{opacity:.45}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:17px 0}
.gallery img,.char-img{width:100%;display:block;border-radius:17px;border:1px solid var(--line);object-fit:cover;background:#eef7fb}
.gallery img{aspect-ratio:1.08/1}.char-img{aspect-ratio:1.08/1}
.mystery{filter:blur(9px) grayscale(1) brightness(.48);transform:scale(.98)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bar{height:10px;background:#e6eff4;border-radius:999px;overflow:hidden;flex:1}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--pink))}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.town{border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center;background:#fff}.town.locked{opacity:.42}.town.current{outline:3px solid #ff87ac}.town.done{background:#eefaf4}
.quote,.hint,.info{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fbfdff;margin-top:9px}.quote{font-weight:800;color:var(--navy);font-size:17px;line-height:1.55}
.choice{margin-top:8px}.msg{min-height:24px;text-align:center;font-weight:800;color:#a13e5e}
.title{font-size:22px;font-weight:900;color:var(--navy);margin:0 0 10px}.name{font-size:36px;font-weight:900;color:var(--pink);text-align:center}.townname{text-align:center;font-weight:900;color:var(--navy)}
.chip{display:inline-block;border-radius:999px;background:var(--green);color:white;padding:4px 9px;font-weight:900;font-size:12px;margin-bottom:5px}
.village{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vitem{border:1px solid var(--line);border-radius:15px;padding:8px;background:white;text-align:center}.vitem img{width:100%;border-radius:12px;aspect-ratio:1.08/1;object-fit:cover}
.end{text-align:center}.end .big{font-size:32px;font-weight:900;color:var(--navy);line-height:1.25}
.small{font-size:12px;color:var(--muted);line-height:1.5}.stack{display:grid;gap:10px}
</style>

let n=0,invited=[],hintCount=0;
try{const s=JSON.parse(localStorage.getItem("machinoko-public-v1"));if(s){n=Math.min(s.n||0,10);invited=Array.isArray(s.invited)?s.invited:[]}}catch(e){}
const $=s=>document.querySelector(s), screen=$("#screen");
function save(){try{localStorage.setItem("machinoko-public-v1",JSON.stringify({n,invited}))}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active");scrollTo(0,0)}
function progress(){$("#bar").style.width=(n*10)+"%";$("#count").textContent=n+" / 10"}
function map(){progress();screen.innerHTML=`<div class="stack"><h2 class="title">北海道 旅MAP</h2><p class="small">次の「まちのコ」に会いに行こう。</p><div class="mapgrid">${C.map((c,i)=>`<div class="town ${i<n?'done':i===n?'current':'locked'}"><b>${String(i+1).padStart(2,'0')}</b><div>${i<n?c.name:i===n?'次の出会い':'？？？'}</div><small>${i<n?c.town:''}</small></div>`).join("")}</div>${n<10?'<button id="go" class="btn primary">次のコに会いに行く</button>':''}<button id="village" class="btn">自分の村を見る</button></div>`;if(n<10)$("#go").onclick=encounter;$("#village").onclick=village}
function encounter(){const c=C[n];hintCount=0;screen.innerHTML=`<div class="stack"><button id="back" class="btn">← MAP</button><h2 class="title">このコは、どこの町のコ？</h2><img class="char-img mystery" src="${c.img}" alt="未発見のまちのコ"><div class="quote">${c.intro}</div><div id="hints"></div><button id="hintBtn" class="btn">ヒントを見る</button><div>${c.choices.map(x=>`<button class="btn choice">${x}</button>`).join("")}</div><div id="msg" class="msg"></div></div>`;$("#back").onclick=map;$("#hintBtn").onclick=()=>{if(hintCount<3){const d=document.createElement("div");d.className="hint";d.innerHTML=`<b>ヒント${hintCount+1}</b><br>${c.hints[hintCount]}`;$("#hints").appendChild(d);hintCount++;if(hintCount===3)$("#hintBtn").disabled=true}};document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(b.textContent===c.town)reveal();else $("#msg").textContent="ちがうみたい。ヒントをもう一つ見てみよう！"})}
function reveal(){const c=C[n];screen.innerHTML=`<div class="stack"><div class="townname">✨ まちのコ発見！ ✨</div><img class="char-img" src="${c.img}" alt="${c.name}"><div class="townname">${c.town}</div><div class="name">${c.name}</div><button id="mini" class="btn primary">ご当地ミニゲームへ</button></div>`;$("#mini").onclick=mini}
function mini(){const c=C[n];screen.innerHTML=`<div class="stack"><h2 class="title">ご当地ミニゲーム</h2><p>${c.town}に関係するものを選ぼう！</p><img class="char-img" src="${c.img}" alt="${c.name}">${c.mini.map((x,i)=>`<button class="btn m" data-i="${i}">${x}</button>`).join("")}<div id="msg" class="msg"></div></div>`;document.querySelectorAll(".m").forEach(b=>b.onclick=()=>{if(+b.dataset.i===0){$("#msg").textContent="✨ 正解！";setTimeout(profile,350)}else $("#msg").textContent="おしい！もう一度。"})}
function profile(){const c=C[n];screen.innerHTML=`<div class="stack"><img class="char-img" src="${c.img}" alt="${c.name}"><div class="townname">${c.town}</div><div class="name">${c.name}</div><div class="info"><span class="chip">モチーフ</span><div>${c.motif}</div></div><div class="info"><span class="chip">PR・名産</span><div>${c.pr}</div></div><div class="info"><span class="chip">おすすめスポット</span><div>${c.spot}</div></div><div class="info"><span class="chip">村に来ると</span><div>「${c.facility}」が建ちます。</div></div><button id="invite" class="btn primary">自分の村へ招待する</button></div>`;$("#invite").onclick=()=>{if(!invited.includes(n))invited.push(n);const old=n;n++;save();if(n>=10)ending();else{screen.innerHTML=`<div class="stack" style="text-align:center"><div style="font-size:54px">🎉</div><h2>仲間が増えました！</h2><p>「${C[old].facility}」が村に増えました。</p><button id="next" class="btn primary">次の町へ</button></div>`;$("#next").onclick=map}}}
function village(){screen.innerHTML=`<div class="stack"><button id="back" class="btn">← MAP</button><h2 class="title">わたしの村</h2><div class="village">${invited.length?invited.map(i=>`<div class="vitem"><img src="${C[i].img}" alt="${C[i].name}"><b>${C[i].name}</b><div class="small">${C[i].facility}</div></div>`).join(""):'<div class="vitem"><div style="font-size:48px">🌱</div><b>まだ静かな村</b></div>'}</div></div>`;$("#back").onclick=()=>n>=10?ending():map}
function ending(){progress();screen.innerHTML=`<div class="end stack"><div style="font-size:40px">✨❄️🌿📷🧊✨</div><p><b>10の町を知った。</b></p><div class="big">北海道には、まだ<br><span style="color:var(--pink)">169</span> の出会いがある。</div><div class="tag">北海道発見率 5.6%</div><p><b>179の出会いで、わたしの北海道をつくろう。</b></p><div class="info" style="text-align:left"><b>師匠に聞きたいこと</b><p>① 次のキャラクターも見たい？</p><p>② 一番好きだった「まちのコ」は？</p><p>③ 行ってみたくなった町はあった？</p></div><button id="vill" class="btn">完成した村を見る</button><button id="reset" class="btn primary">最初から遊ぶ</button></div>`;$("#vill").onclick=village;$("#reset").onclick=()=>{n=0;invited=[];save();map()}}
$("#gallery").innerHTML=[0,3,6,8].map(i=>`<img src="${C[i].img}" alt="${C[i].name}">`).join("");
$("#start").onclick=()=>{show("game");if(n>=10)ending();else map()};
</script></body></html>
